name: mapping
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # BLAST from lecture 20
  - blast=2.17.0
  # alignment and variant calling
  - minimap2=2.31
  - samtools=1.24
  - sambamba=1.0.1
  - freebayes=1.3.10
  - vcflib=1.0.15
  - vcftools=0.1.17
  - bcftools=1.25
  # keep vt at 0.57721: conda ranks the old 2015 build higher, and that build downgrades the other tools and breaks snpEff
  - vt=0.57721
  - snpeff=5.4.0c
  # plot-vcfstats
  - matplotlib=3.11.2
  - tectonic=0.17.0
